<html>
  <body>
    <iframe src="https://cinesrc.st/embed/movie/1084242?autoplay=true" width="100%" height="100%" allow="autoplay; fullscreen" id="player"></iframe>
    <script>
      const iframe = document.getElementById('player');
      function sendCommand(command, args = []) {
        iframe.contentWindow.postMessage({
          type: 'cinesrc:command',
          command,
          args
        }, 'https://cinesrc.st');
      }
      
      window.addEventListener('message', (event) => {
        if (event.origin !== 'https://cinesrc.st') return;
        
        // ignore timeupdate for cleaner logs
        if (event.data.type !== 'cinesrc:timeupdate') {
           console.log('MSG_FROM_PLAYER:', JSON.stringify(event.data));
        }
        
        if (event.data.type === 'cinesrc:ready') {
          console.log('Player is ready, sending HLS test commands...');
          const commands = [
            'getLevels', 'getCurrentLevel', 'getAudioTracks', 'getAudioTrack',
            'getVariants', 'getQualities', 'getVideoQualities', 'getCaptions',
            'getSubtitles', 'getTextTracks'
          ];
          for (const cmd of commands) {
            sendCommand(cmd);
          }
        }
      });
    </script>
  </body>
</html>
